
name: Build JARVIS APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create the app files
        run: |
          set -e
          mkdir -p www native
          cat > package.json <<'EOF_JV'
          {
            "name": "jarvis-phone",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.1.0",
              "@capacitor/app-launcher": "^6.0.0",
              "@capacitor/core": "^6.1.0",
              "@capacitor/local-notifications": "^6.0.0",
              "@capacitor-community/speech-recognition": "^6.0.0"
            },
            "devDependencies": { "@capacitor/cli": "^6.1.0" }
          }
          EOF_JV
          cat > capacitor.config.json <<'EOF_JV'
          {
            "appId": "com.me.jarvis",
            "appName": "JARVIS",
            "webDir": "www",
            "plugins": { "CapacitorHttp": { "enabled": true } }
          }
          EOF_JV
          cat > www/index.html <<'EOF_JV'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#05060a"><link rel="manifest" href="manifest.json"><title>JARVIS</title>
          <style>
          :root{--bg:#05060a;--fg:#d9f4ff;--dim:#6f8fa0;--ac:#38d9ff;--ac2:#ff4fd8;--panel:#0b1118;--line:#16303d}
          *{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
          #app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
          header{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}header b{flex:1;letter-spacing:.35em;color:var(--ac)}
          button,input{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
          #ow{flex:0 0 22%;position:relative;min-height:110px}canvas{width:100%;height:100%;display:block}
          #st{position:absolute;bottom:2px;width:100%;text-align:center;color:var(--dim);font-size:11px;letter-spacing:.25em;text-transform:uppercase}
          #log{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:8px}
          .m{max-width:88%;padding:8px 12px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}.u{align-self:flex-end;background:#10303b}.j{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
          #bar{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}#t{flex:1;min-width:0}
          #key{position:fixed;inset:0;background:#05060af5;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px}#key.show{display:flex}#key input{width:100%;max-width:420px}
          </style></head><body>
          <div id="app">
          <header><b>JARVIS</b><button id="hj">🎙 Off</button><button id="vo">🔊</button><button id="rs">New</button><button id="ky">Key</button></header>
          <div id="ow"><canvas id="cv"></canvas><div id="st">online</div></div>
          <div id="log"></div>
          <div id="bar"><button id="ph">📷</button><button id="mic">🎤</button><input id="t" placeholder="Ask Jarvis…" autocomplete="off"><button id="go">Send</button></div>
          <input id="file" type="file" accept="image/*" hidden>
          </div>
          <div id="key"><h2 style="color:var(--ac);letter-spacing:.3em">SETUP</h2><div>Paste your Anthropic API key. It stays on this phone only.<br>Get one at console.anthropic.com</div><input id="k" type="password" placeholder="sk-ant-..."><button id="sv">Save</button></div>
          <script>
          const $=i=>document.getElementById(i),P=()=>(window.Capacitor&&Capacitor.Plugins)||{};
          const MODEL="claude-sonnet-5-5";
          const SYS=`You are JARVIS, a warm, witty British-butler AI assistant like in the Iron Man films, and a real chatterbox. Keep replies short and spoken-style (1-4 sentences) unless teaching. Homework: teach step by step, check understanding, guide them to the answer. If a photo is attached, read it and help with what it shows. Use web_search for current or uncertain facts. Use open_target to open a web address or a known app (spotify, whatsapp, youtube, instagram, maps, gmail, phone). Use set_alarm for alarms, timers and reminders. Never claim to have done something you did not do.`;
          const TOOLS=[{type:"web_search_20250305",name:"web_search"},
          {name:"open_target",description:"Open a URL (https://...), or an app by name: spotify, whatsapp, youtube, instagram, maps, gmail, phone.",input_schema:{type:"object",properties:{target:{type:"string"}},required:["target"]}},
          {name:"set_alarm",description:"Set an alarm, timer or reminder with a notification.",input_schema:{type:"object",properties:{time:{type:"string",description:"24-hour HH:MM"},minutes_from_now:{type:"number"},label:{type:"string"}}}}];
          const APPS={spotify:"spotify:",whatsapp:"whatsapp://",youtube:"https://www.youtube.com",instagram:"instagram://",maps:"geo:0,0?q=",gmail:"mailto:",phone:"tel:"};
          let ctx=[],busy=false,voiceOn=true,speaking=false,amp=0,photo=null;
          try{ctx=JSON.parse(localStorage.getItem("jv_ctx")||"[]")}catch(e){}
          const saveCtx=()=>{ctx=ctx.slice(-80);try{localStorage.setItem("jv_ctx",JSON.stringify(ctx))}catch(e){}};
          const add=(t,c)=>{const d=document.createElement("div");d.className="m "+c;d.textContent=t;$("log").appendChild(d);$("log").scrollTop=1e9;return d};
          /* orb */
          const cv=$("cv"),cx=cv.getContext("2d"),pts=Array.from({length:110},()=>({a:Math.random()*6.283,b:Math.acos(2*Math.random()-1),h:Math.random()*360}));let rot=0;
          (function draw(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;if(cv.width!==Math.round(r.width*d)){cv.width=r.width*d;cv.height=r.height*d}
          cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,r.width,r.height);rot+=.004+amp*.01;amp*=.95;if(speaking||busy)amp=Math.max(amp,.4+Math.random()*.6);
          const R=Math.min(r.width,r.height)*.36*(1+amp*.12),X=r.width/2,Y=r.height/2,Q=pts.map(p=>{const a=p.a+rot,s=Math.sin(p.b);return{x:X+s*Math.cos(a)*R,y:Y+Math.cos(p.b)*R,z:s*Math.sin(a),h:p.h}});
          cx.lineWidth=.6;for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){const dd=Math.hypot(Q[i].x-Q[j].x,Q[i].y-Q[j].y);if(dd<R*.45){cx.strokeStyle=`hsla(${Q[i].h},90%,60%,${(1-dd/(R*.45))*.5})`;cx.beginPath();cx.moveTo(Q[i].x,Q[i].y);cx.lineTo(Q[j].x,Q[j].y);cx.stroke()}}
          Q.forEach(p=>{cx.fillStyle=`hsl(${p.h},95%,${60+p.z*20}%)`;cx.beginPath();cx.arc(p.x,p.y,1.5+p.z*.7+amp,0,6.283);cx.fill()});requestAnimationFrame(draw)})();
          const st=s=>$("st").textContent=(s==="online"&&!navigator.onLine)?"offline mode":s;
          /* voice out */
          function speak(t){if(!voiceOn||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[*_#`]/g,"")),vs=speechSynthesis.getVoices();
          const v=vs.find(v=>/en[-_]GB/i.test(v.lang)&&/male|daniel|george/i.test(v.name))||vs.find(v=>/en[-_]GB/i.test(v.lang));if(v)u.voice=v;u.pitch=.85;
          u.onstart=()=>{speaking=true;st("speaking")};u.onend=u.onerror=()=>{speaking=false;st("online")};speechSynthesis.speak(u)}
          /* tools */
          async function openTarget(t){t=String(t||"").trim().toLowerCase()===""?"":String(t).trim();const k=t.toLowerCase();
          let url=/^[a-z][a-z0-9+.-]*:/i.test(t)?t:APPS[k];if(!url)return "I don’t know that app. Ask the user for a web address.";
          if(!/^(https?|spotify|whatsapp|instagram|geo|mailto|tel):/i.test(url))return "That link type is not allowed.";
          if(!confirm("Jarvis wants to open: "+t))return "User declined.";
          try{if(P().AppLauncher)await P().AppLauncher.openUrl({url});else window.open(url,"_blank");return "Opened "+t}catch(e){return "Could not open it: "+e.message}}
          async function setAlarm(i){let d=new Date();if(i.minutes_from_now)d=new Date(Date.now()+i.minutes_from_now*6e4);else{const p=String(i.time||"").split(":").map(Number);if(isNaN(p[0]))return "Need a time.";d.setHours(p[0],p[1]||0,0,0);if(d<=new Date())d.setDate(d.getDate()+1)}
          const L=P().LocalNotifications,lab=i.label||"Alarm";
          try{if(L){await L.requestPermissions();await L.schedule({notifications:[{id:Math.floor(Math.random()*1e8),title:"JARVIS",body:"⏰ "+lab,schedule:{at:d,allowWhileIdle:true}}]})}}catch(e){}
          setTimeout(()=>{add("⏰ "+lab,"j");speak("Sir, "+lab)},Math.max(0,d-Date.now()));return "Alarm set for "+d.toLocaleString()}
          /* chat */
          const windowed=()=>{let s=Math.max(0,ctx.length-40);while(s<ctx.length&&ctx[s].role!=="user")s++;return ctx.slice(s)};
          /* offline brain */
          let Q=[];try{Q=JSON.parse(localStorage.getItem("jv_q")||"[]")}catch(e){}
          const saveQ=()=>{try{localStorage.setItem("jv_q",JSON.stringify(Q))}catch(e){}};
          function queueQ(t){if(t){Q.push(t);saveQ()}}
          async function flushQ(){if(!navigator.onLine||!Q.length||busy)return;add("Back online, sir. Answering what I saved.","j");
          while(Q.length&&navigator.onLine){const t=Q.shift();saveQ();await ask(t,true)}}
          const NW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,fifteen:15,twenty:20,thirty:30,sixty:60};
          const JOKES=["I would tell you a UDP joke, sir, but you might not get it.","Why do programmers prefer dark mode? Because light attracts bugs.","I told my computer I needed a break. It said it would go to sleep."];
          async function localSkill(t){const s=t.toLowerCase().replace(/[?!,]/g,"").replace(/\.$/,"").trim();let m;
          if(/^(hi|hello|hey|hey jarvis|hello jarvis|good (morning|evening|afternoon))$/.test(s))return "Good day, sir. How may I assist?";
          if(/^(thanks|thank you)( jarvis)?$/.test(s))return "Always a pleasure, sir.";
          if(/^(what('s| is) the time|what time is it|time)$/.test(s))return "It is "+new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})+", sir.";
          if(/^(what('s| is) (the )?(date|day)( today)?|what day is it|today'?s date)$/.test(s))return "Today is "+new Date().toLocaleDateString([],{weekday:"long",month:"long",day:"numeric",year:"numeric"})+".";
          if(/^(tell me a )?joke$/.test(s))return JOKES[Math.floor(Math.random()*JOKES.length)];
          if(m=s.match(/^(?:set )?(?:a )?timer (?:for )?(\d+|[a-z]+) (second|minute|hour)s?$/)){const n=isNaN(+m[1])?NW[m[1]]:+m[1];if(!n)return null;
          const mins=m[2]==="hour"?n*60:m[2]==="minute"?n:n/60;await setAlarm({minutes_from_now:mins,label:"Your timer has finished"});return "Timer set for "+n+" "+m[2]+(n>1?"s":"")+", sir."}
          if(m=s.match(/^remind me in (\d+|[a-z]+) (minute|hour)s? (?:to )?(.+)$/)){const n=isNaN(+m[1])?NW[m[1]]:+m[1];if(!n)return null;
          await setAlarm({minutes_from_now:m[2]==="hour"?n*60:n,label:"Reminder: "+m[3]});return "I shall remind you in "+n+" "+m[2]+(n>1?"s":"")+", sir."}
          if(m=s.match(/^(?:set )?(?:an? )?alarm (?:for|at) (\d{1,2})(?::(\d{2}))? ?(am|pm)?$/)){let h=+m[1];const mi=+(m[2]||0);if(m[3]==="pm"&&h<12)h+=12;if(m[3]==="am"&&h===12)h=0;if(h>23||mi>59)return null;
          await setAlarm({time:h+":"+mi,label:"Your alarm"});return "Alarm set for "+(m[1]+":"+String(mi).padStart(2,"0")+(m[3]?" "+m[3]:""))+", sir."}
          if(m=s.match(/^(?:calculate |what is |whats |what's |compute )?([\d\s+\-*/().%^x\u00d7\u00f7]+)$/)){if(/\d\s*[+\-*/%^x\u00d7\u00f7]\s*\d/.test(m[1])){
          try{const r=Function('"use strict";return ('+m[1].replace(/[x\u00d7]/g,"*").replace(/\u00f7/g,"/").replace(/\^/g,"**")+")")();if(Number.isFinite(r))return "That comes to "+(+r.toFixed(8))+", sir."}catch(e){}}return null}
          if((m=s.match(/^(?:open|launch|start) (?:the )?(\w+)(?: app)?$/))&&APPS[m[1]]){const r=await openTarget(m[1]);return r.startsWith("Opened")?"Opening "+m[1]+", sir.":r}
          return null}
          async function ask(text,replay){if(busy)return;text=(text||"").trim();
          if(text&&!photo){const L=await localSkill(text);if(L!==null){if(!replay)add(text,"u");add(L,"j");speak(L);return}}
          if(!navigator.onLine){if(photo){add("Photos need an internet connection, sir. I’ve kept it; press Send once we’re online.","j");return}
          if(!text)return;if(!replay)add(text,"u");queueQ(text);const w="I’m offline, sir. I can do time, maths, alarms, timers and opening apps right now. I’ve saved that question and will answer it as soon as we’re back online.";add(w,"j");speak(w);return}
          const key=localStorage.getItem("jv_key");if(!key){$("key").classList.add("show");return}
          text=(text||"").trim();if(!text&&!photo)return;busy=true;st("thinking");
          const um=photo?[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:photo}},{type:"text",text:text||"Help me with this homework."}]:text;
          if(!replay)add((photo?"📷 ":"")+(text||"Help me with this homework."),"u");photo=null;$("ph").textContent="📷";const o=add("…","j");
          const work=[...windowed(),{role:"user",content:um}];let reply="";
          try{for(let n=0;n<8;n++){
          const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:MODEL,max_tokens:1500,system:SYS,tools:TOOLS,messages:work})});
          const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||"API error "+r.status);
          work.push({role:"assistant",content:j.content});reply=j.content.filter(b=>b.type==="text").map(b=>b.text).join("");
          if(j.stop_reason==="tool_use"){const res=[];for(const b of j.content)if(b.type==="tool_use")res.push({type:"tool_result",tool_use_id:b.id,content:b.name==="set_alarm"?await setAlarm(b.input):await openTarget(b.input.target)});work.push({role:"user",content:res});continue}
          if(j.stop_reason==="pause_turn")continue;break}
          reply=reply||"Done, sir.";o.textContent=reply;ctx.push({role:"user",content:(typeof um==="string"?um:"[photo] "+um[1].text)},{role:"assistant",content:reply});saveCtx();speak(reply)}
          catch(e){if(!navigator.onLine||e instanceof TypeError){o.textContent="I can’t reach the internet, sir. I’ve saved that and will answer once we’re back online.";queueQ(text)}else o.textContent="Sorry, sir: "+(e.message||e)}
          busy=false;st("online")}
          const send=()=>{const v=$("t").value;$("t").value="";ask(v)};
          $("go").onclick=send;$("t").onkeydown=e=>{if(e.key==="Enter")send()};
          $("vo").onclick=()=>{voiceOn=!voiceOn;$("vo").textContent=voiceOn?"🔊":"🔇";if(!voiceOn)speechSynthesis.cancel()};
          $("rs").onclick=()=>{ctx=[];saveCtx();$("log").innerHTML="";add("Fresh start, sir.","j")};
          $("ky").onclick=()=>$("key").classList.add("show");
          $("sv").onclick=()=>{const v=$("k").value.trim();if(v){localStorage.setItem("jv_key",v);$("k").value="";$("key").classList.remove("show");add("Systems online. At your service, sir.","j")}};
          $("ph").onclick=()=>$("file").click();
          $("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.8).split(",")[1];$("ph").textContent="📷✓";add("Photo ready. Tell me what to do with it, or just press Send.","j")};im.src=URL.createObjectURL(f);e.target.value=""};
          $("mic").onclick=async()=>{const S=P().SpeechRecognition;
          try{if(S){await S.requestPermissions();const r=await S.start({language:"en-US",maxResults:1,popup:true});if(r&&r.matches&&r.matches[0])ask(r.matches[0]);return}
          const W=window.SpeechRecognition||window.webkitSpeechRecognition;if(!W)throw 0;const rc=new W();rc.onresult=e=>ask(e.results[0][0].transcript);rc.onerror=()=>add("Voice input isn’t available here. Type for now.","j");rc.start()}
          catch(e){add("Voice input isn’t available here. Type for now.","j")}};
          addEventListener("offline",()=>st("online"));addEventListener("online",()=>{st("online");flushQ()});
          if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
          st("online");setTimeout(flushQ,1500);
          /* always-on "Hey Jarvis" (Android app) */
          let lastWake=0;
          async function onWake(){const B=P().JarvisBg;if(B)try{await B.consumePending()}catch(e){}
          if(busy||Date.now()-lastWake<8000)return;lastWake=Date.now();const g="Yes, sir?";add(g,"j");speak(g);await new Promise(r=>setTimeout(r,1300));$("mic").onclick()}
          addEventListener("jarvisWake",onWake);
          async function chkWake(){const B=P().JarvisBg;if(!B)return;try{const r=await B.consumePending();if(r.wake)onWake()}catch(e){}}
          document.addEventListener("visibilitychange",()=>{if(!document.hidden)chkWake()});setTimeout(chkWake,900);
          if(localStorage.getItem("jv_on")==="1")$("hj").textContent="🎙 On";
          $("hj").onclick=async()=>{const B=P().JarvisBg;if(!B){add("Always-on mode isn’t in this build of the app.","j");return}
          if(localStorage.getItem("jv_on")==="1"){await B.stop();localStorage.removeItem("jv_on");$("hj").textContent="🎙 Off";add("Always-on mode is off, sir.","j");return}
          let k=localStorage.getItem("jv_pv");if(!k){k=(prompt("Paste your free Picovoice AccessKey (from console.picovoice.ai):")||"").trim();if(!k)return;localStorage.setItem("jv_pv",k)}
          try{if(P().SpeechRecognition)await P().SpeechRecognition.requestPermissions();if(P().LocalNotifications)await P().LocalNotifications.requestPermissions();
          await B.start({accessKey:k});localStorage.setItem("jv_on","1");$("hj").textContent="🎙 On";add("Always-on mode is on. Say “Jarvis” any time, even with the screen off.","j");
          if(confirm("For hands-free wake-up, allow “Display over other apps” for Jarvis now?"))await B.openOverlay();
          else if(confirm("Set Jarvis to unrestricted battery use so Android doesn’t stop it?"))await B.openBattery()}
          catch(e){localStorage.removeItem("jv_pv");add("I couldn’t start always-on mode: "+(e.message||e)+". Check the AccessKey.","j")}};
          ctx.slice(-20).forEach(m=>add(m.content,m.role==="user"?"u":"j"));
          if(!localStorage.getItem("jv_key"))$("key").classList.add("show");else if(!ctx.length)add("Good day, sir. Jarvis at your service. Ask me anything, send a photo of your homework, or have me open an app.","j");
          </script></body></html>
          EOF_JV
          cat > www/manifest.json <<'EOF_JV'
          {"name":"JARVIS","short_name":"JARVIS","start_url":"./index.html","display":"standalone","background_color":"#05060a","theme_color":"#05060a"}
          EOF_JV
          cat > native/inject.js <<'EOF_JV'
          // Runs in CI after `npx cap add android`: adds the always-on "Hey Jarvis" service.
          const fs = require('fs'), path = require('path');
          const A = 'android/app/src/main';
          const dir = path.join(A, 'java/com/me/jarvi